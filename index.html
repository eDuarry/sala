<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Nodo41 · Nueva videollamada</title>
<style>
  :root { --bg:#f4f5f8; --card:#fff; --fg:#15171c; --muted:#5d6472; --line:#dde1e8; --accent:#2f6fdf; --ok:#13804b; color-scheme: light; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0f1115; --card:#181b21; --fg:#e8eaf0; --muted:#9aa2b1; --line:#2a2f38; --accent:#6ea2ff; --ok:#4cc38a; color-scheme: dark; } }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--fg);
         font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif; padding:24px 16px; box-sizing:border-box; }
  main { width:100%; max-width:440px; background:var(--card); border:1px solid var(--line); border-radius:16px; padding:24px; display:grid; gap:14px; box-sizing:border-box; }
  h1 { font-size:21px; margin:0; }
  p { margin:0; color:var(--muted); font-size:14.5px; }
  label { font-weight:600; font-size:14px; }
  input { font:inherit; padding:10px 12px; border:1px solid var(--line); border-radius:10px; background:var(--bg); color:var(--fg); width:100%; box-sizing:border-box; }
  input:focus { outline:2px solid var(--accent); outline-offset:1px; }
  .fila { display:flex; gap:8px; flex-wrap:wrap; }
  button, a.boton { font:inherit; font-weight:600; padding:10px 16px; border-radius:10px; border:0; cursor:pointer; text-decoration:none; text-align:center; flex:1; }
  .primario { background:var(--accent); color:#fff; }
  .secundario { background:var(--bg); color:var(--fg); border:1px solid var(--line); }
  #resultado { display:grid; gap:10px; }
  #resultado[hidden] { display:none; }
  #enlace { font:13.5px/1.4 ui-monospace,Menlo,monospace; word-break:break-all; background:var(--bg); border:1px solid var(--line); border-radius:10px; padding:10px 12px; user-select:all; }
  #hecho { color:var(--ok); font-size:14px; min-height:1.4em; }
</style>
</head>
<body>
<main>
  <h1>Nueva videollamada</h1>
  <p>Escribe el nombre del cliente y envíale el enlace. La sala se abre cuando entra el primero; el código del final hace que nadie más pueda adivinarla.</p>
  <label for="nombre">Nombre del cliente</label>
  <input id="nombre" placeholder="Por ejemplo, Juan Pérez" autocomplete="off" autofocus>
  <button class="primario" id="crear">Crear enlace</button>
  <div id="resultado" hidden>
    <div id="enlace"></div>
    <div class="fila">
      <button class="secundario" id="copiar">Copiar enlace</button>
      <a class="boton primario" id="entrar" href="#">Entrar ahora</a>
    </div>
    <div id="hecho"></div>
  </div>
</main>
<script>
// Página de inicio de sala.nodo41.com: crea el enlace de una sala para un cliente. Las salas las abre 404.html.
// Ver eDuarry/olimpo, docs/nodo41.md («Cal.diy»).
var $ = function (id) { return document.getElementById(id); };
function crear() {
  var nombre = $("nombre").value.trim().replace(/[\/?#%]+/g, " ").trim().replace(/\s+/g, "-") || "Cliente";
  var codigo = crypto.randomUUID ? crypto.randomUUID()
    : Array.from(crypto.getRandomValues(new Uint8Array(16)), function (b) { return b.toString(16).padStart(2, "0"); }).join("");
  var url = "https://sala.nodo41.com/" + nombre + "-" + codigo;   // con tildes tal cual: se lee mejor al enviarlo
  $("enlace").textContent = url;
  $("entrar").href = url;
  $("resultado").hidden = false;
  $("hecho").textContent = "";
}
$("crear").onclick = crear;
$("nombre").addEventListener("keydown", function (e) { if (e.key === "Enter") crear(); });
$("copiar").onclick = function () {
  var t = $("enlace").textContent;
  (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(function () {
    $("hecho").textContent = "Copiado. Pégalo en el correo o el WhatsApp del cliente.";
  }, function () {
    var r = document.createRange(); r.selectNodeContents($("enlace"));
    var s = getSelection(); s.removeAllRanges(); s.addRange(r);
    $("hecho").textContent = "Selecciona el enlace y cópialo.";
  });
};
</script>
</body>
</html>
